name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Every deploy re-runs the gates. main is the live site, so nothing red publishes:
  # a failing test, an AC without a test outside the accepted baseline, or a stale
  # traceability matrix all stop the deploy job from ever starting.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests (app + spec-trace self-tests)
        run: npm test

      - name: AC coverage
        run: npm run coverage:ac

      - name: Traceability chain
        run: npm run check:trace

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        # Every deploy carries a legible version stamp: view-source on the live
        # site shows the UTC build time (to the second) and the commit it came from.
        run: |
          STAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC') (${GITHUB_SHA::7})"
          sed -i "s|<meta name=\"build-version\" content=\"dev\" />|<meta name=\"build-version\" content=\"$STAMP\" />|" src/index.html
          grep -F "$STAMP" src/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4